version: '3.8'

services:
  db:
    image: postgres:15
    container_name: solarsight_db
    environment:
      POSTGRES_USER: solarsight
      POSTGRES_PASSWORD: password
      POSTGRES_DB: solarsight_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: solarsight_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
